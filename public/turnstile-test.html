<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turnstile 測試頁</title>
<style>
  body {
    font-family: -apple-system, "Segoe UI", "Noto Sans TC", sans-serif;
    max-width: 640px;
    margin: 32px auto;
    padding: 0 16px;
    color: #222;
    line-height: 1.6;
  }
  h1 { font-size: 20px; }
  label { display: block; margin-top: 12px; font-size: 14px; color: #444; }
  input[type=text] {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 10px;
    font-size: 14px;
    border: 1px solid #ccc;
    border-radius: 6px;
    margin-top: 4px;
  }
  .row { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button {
    padding: 8px 16px;
    font-size: 14px;
    border: 1px solid #2563eb;
    background: #2563eb;
    color: #fff;
    border-radius: 6px;
    cursor: pointer;
  }
  button.secondary {
    background: #fff;
    color: #2563eb;
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #info {
    margin-top: 16px;
    padding: 10px 12px;
    background: #f3f4f6;
    border-radius: 6px;
    font-size: 13px;
  }
  #info div { margin: 2px 0; word-break: break-all; }
  #widget-holder { margin-top: 16px; min-height: 66px; }
  #log {
    margin-top: 16px;
    padding: 10px 12px;
    background: #0b1021;
    color: #d7ffe0;
    border-radius: 6px;
    font-family: ui-monospace, Menlo, Consolas, monospace;
    font-size: 12.5px;
    white-space: pre-wrap;
    word-break: break-all;
    max-height: 360px;
    overflow-y: auto;
  }
  .log-error { color: #ff8a8a; }
  .log-warn { color: #ffd58a; }
  .log-ok { color: #8affa0; }
  .hint { font-size: 12.5px; color: #666; margin-top: 4px; }
  code { background: #eee; padding: 1px 5px; border-radius: 4px; }
</style>
</head>
<body>

<h1>Cloudflare Turnstile 獨立測試頁</h1>
<p class="hint">
  這個頁面跟留言表單、Supabase、你的 Nuxt 專案都無關，只單獨測試 Turnstile
  widget 本身能不能在「目前這個網域」通過驗證，方便排除是不是 sitekey /
  網域設定的問題。把這個檔案放進 <code>public/</code> 資料夾部署上去後，
  用瀏覽器直接打開它的網址來測。
</p>

<div id="info">
  <div>目前網址（origin）：<strong id="origin"></strong></div>
  <div>目前網域（hostname）：<strong id="hostname"></strong></div>
  <div class="hint">
    這個 hostname 必須跟 Cloudflare Turnstile 後台這把 Site Key
    的「Domains」清單裡的其中一項完全相符，驗證才會過。
  </div>
</div>

<label>Site Key（要測試的那把，貼上就好，不用引號）</label>
<input type="text" id="sitekey" placeholder="例如：0x4AAAAAAA... 或測試用 1x00000000000000000000AA">

<label>action（跟你 server 端驗證比對用，預設對齊你專案目前用的值）</label>
<input type="text" id="action" value="tech_comment">

<div class="row">
  <button id="load-btn">載入驗證元件</button>
  <button id="reset-btn" class="secondary" disabled>移除並重置</button>
  <button id="fill-test-btn" class="secondary">帶入官方一定會過的測試 Key</button>
</div>

<div id="widget-holder"></div>

<div id="log">等待操作…\n</div>

<script>
  const $ = (id) => document.getElementById(id);
  const logEl = $('log');
  const loadBtn = $('load-btn');
  const resetBtn = $('reset-btn');
  const fillTestBtn = $('fill-test-btn');
  const sitekeyInput = $('sitekey');
  const actionInput = $('action');

  $('origin').textContent = location.origin || '(空白，可能是用 file:// 直接打開)';
  $('hostname').textContent = location.hostname || '(空白，file:// 沒有 hostname，多數正式 sitekey 會直接被判定網域不符)';

  function log(message, level) {
    const time = new Date().toLocaleTimeString('zh-TW', { hour12: false });
    const line = document.createElement('div');
    if (level) line.className = 'log-' + level;
    line.textContent = '[' + time + '] ' + message;
    logEl.appendChild(line);
    logEl.scrollTop = logEl.scrollHeight;
  }

  let widgetId;
  let scriptLoading;

  function loadTurnstileScript() {
    if (window.turnstile) return Promise.resolve();
    if (scriptLoading) return scriptLoading;

    scriptLoading = new Promise((resolve, reject) => {
      const script = document.createElement('script');
      script.src = 'https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit';
      script.async = true;
      script.defer = true;
      script.onload = () => {
        log('challenges.cloudflare.com 的 api.js 已載入成功。', 'ok');
        resolve();
      };
      script.onerror = () => {
        log('api.js 載入失敗！這通常代表瀏覽器/網路擋掉了 challenges.cloudflare.com，是網路層的問題，不是 sitekey 設定問題。', 'error');
        reject(new Error('script_load_failed'));
      };
      document.head.appendChild(script);
      log('開始載入 challenges.cloudflare.com/turnstile/v0/api.js …');
    });

    return scriptLoading;
  }

  async function render() {
    const sitekey = sitekeyInput.value.trim();
    const action = actionInput.value.trim() || 'tech_comment';

    if (!sitekey) {
      log('請先填入 Site Key。', 'warn');
      return;
    }

    loadBtn.disabled = true;
    log('使用 Site Key：' + sitekey + '　action：' + action);

    try {
      await loadTurnstileScript();
    } catch {
      loadBtn.disabled = false;
      return;
    }

    if (widgetId !== undefined) {
      window.turnstile.remove(widgetId);
      widgetId = undefined;
    }

    $('widget-holder').innerHTML = '';

    try {
      widgetId = window.turnstile.render('#widget-holder', {
        sitekey,
        action,
        theme: 'auto',
        size: 'flexible',
        retry: 'never',
        'refresh-expired': 'manual',
        'refresh-timeout': 'manual',

        callback: (token) => {
          log('✅ 驗證成功！拿到 token（開頭 24 碼）：' + token.slice(0, 24) + '…', 'ok');
          log('這代表 Turnstile 本身在這個網域是通的；如果正式留言表單還是失敗，問題就在你 server 端驗證那段（hostname 允許清單、action 是否一致、token 有沒有被重複使用）。', 'ok');
        },

        'error-callback': (errorCode) => {
          log('❌ error-callback 觸發，Cloudflare 回傳的錯誤代碼：' + (errorCode ?? '(沒有帶代碼)'), 'error');
          log('拿這個代碼去查 https://developers.cloudflare.com/turnstile/troubleshooting/client-side-errors/error-codes/ 對照，例如 110200 是網域未授權、400020 是 sitekey 無效、400070 是 sitekey 被停用。', 'error');
        },

        'expired-callback': () => {
          log('⚠️ expired-callback：驗證已過期。', 'warn');
        },

        'timeout-callback': () => {
          log('⚠️ timeout-callback：驗證逾時（通常是使用者太久沒完成互動式挑戰）。', 'warn');
        },
      });

      log('widget 已呼叫 render()，等待畫面上的驗證元件回應…');
      resetBtn.disabled = false;
    } catch (err) {
      log('render() 呼叫時直接丟出例外：' + (err && err.message ? err.message : String(err)), 'error');
    } finally {
      loadBtn.disabled = false;
    }
  }

  function reset() {
    if (widgetId !== undefined && window.turnstile) {
      window.turnstile.remove(widgetId);
      widgetId = undefined;
    }
    $('widget-holder').innerHTML = '';
    resetBtn.disabled = true;
    log('已移除驗證元件，可以重新載入再測一次。');
  }

  loadBtn.addEventListener('click', render);
  resetBtn.addEventListener('click', reset);
  fillTestBtn.addEventListener('click', () => {
    sitekeyInput.value = '1x00000000000000000000AA';
    log('已帶入 Cloudflare 官方「一定會通過」的測試 Site Key（任何網域都適用，包含 file:// 本機開啟）。');
  });
</script>

</body>
</html>
